name: Deploy Tefreela web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.EXPO_PUBLIC_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check public API address
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "Set repository variable EXPO_PUBLIC_API_URL to the public backend URL before deploying."
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Export web app
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
